[project]
name = "shop-backend"
version = "0.1.0"
description = "Shop e-commerce backend: FastAPI + SQLAlchemy async"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",           # dev default DB
    "asyncpg>=0.29",             # production DB
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",   # file upload parsing
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[tool.uv]
package = false
